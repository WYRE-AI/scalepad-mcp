name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Thin caller for the canonical reusable release pipeline. The build →
# semantic-release → Docker buildx push to GHCR → MCP Registry → security chain
# (tag-based release detection + correct gating) lives in wyre-technology/.github
# so every *-mcp repo stays in lockstep instead of drifting per-repo. PR-time
# lint/test gating is each repo's ci.yml concern; this workflow only runs the
# release path. Caller jobs grant the token scopes the reusable jobs request
# (a reusable can only reduce, never expand, caller-granted scope).
jobs:
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write
      security-events: write
    uses: wyre-technology/.github/.github/workflows/mcp-server-release.yml@d28a612a00a1bd0c36aff09e686ce2d1e10ef552
    with:
      server-name: scalepad-mcp
      image-name: ghcr.io/wyre-technology/scalepad-mcp
    secrets: inherit

